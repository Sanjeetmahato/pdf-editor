<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>দুর্গাপূজা বাংলা গান</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="hero">

    <div class="bell">🔔</div>

    <h1>🌺 দুর্গাপূজা 🌺</h1>

    <p>বাংলা দুর্গাপূজার গান ও আগমনী সংগ্রহ</p>

    <div class="searchBox">
      <input
        type="text"
        id="searchInput"
        placeholder="গান খুঁজুন..."
      >
      <button onclick="searchSongs()">🔍</button>
    </div>

  </header>


  <nav class="categories">

    <button onclick="filterSongs('all')">
      সব গান
    </button>

    <button onclick="filterSongs('agomoni')">
      🌸 আগমনী
    </button>

    <button onclick="filterSongs('mahalaya')">
      🪔 মহালয়া
    </button>

    <button onclick="filterSongs('puja')">
      🥁 পুজোর গান
    </button>

    <button onclick="filterSongs('bhakti')">
      🙏 ভক্তিগীতি
    </button>

  </nav>


  <main>

    <h2>🎵 বাংলা দুর্গাপূজার গান</h2>

    <div id="songList"></div>

  </main>


  <footer>

    <div>🌺 শুভ দুর্গাপূজা 🌺</div>

    <p>
      বাংলা গান • আগমনী • মহালয়া • দুর্গাপূজা
    </p>

  </footer>


  <script src="app.js"></script>

</body>
</html>
